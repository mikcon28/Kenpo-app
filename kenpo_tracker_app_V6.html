            ThumbsUp: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>,
            ThumbsDown: () => <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>
        };

        // Renders an individual Technique, Form, or Set
        const ItemCard = ({ item, userData, updateItem }) => {
            const [expanded, setExpanded] = useState(false);
            const data = userData[item.id] || { notes: '', needsTraining: false };

            return (
                <div className="bg-gray-800 rounded-xl p-4 mb-4 shadow-lg border border-gray-700 transition-all-smooth overflow-hidden">
                    <div 
                        className="flex justify-between items-center cursor-pointer select-none"
                        onClick={() => setExpanded(!expanded)}
                    >
                        <div className="flex-1 pr-4">
                            <h3 className="text-base font-bold text-white leading-tight">{item.name}</h3>
                            <p className="text-xs text-gray-400 mt-1">
                                {item.belt} Belt <span className="mx-1">•</span> 
                                <span className={item.type === 'Form' ? 'text-kenpo-gold' : item.type === 'Set' ? 'text-blue-400' : 'text-gray-400'}>
                                    {item.type}
                                </span>
                            </p>
                        </div>
                        <div className="flex items-center text-gray-400 flex-shrink-0">
                            {data.needsTraining && <span className="w-2.5 h-2.5 rounded-full bg-kenpo-red mr-3 shadow-[0_0_8px_rgba(217,56,30,0.8)]"></span>}
                            {expanded ? <Icons.ChevronUp /> : <Icons.ChevronDown />}
                        </div>
                    </div>

                    {expanded && (
                        <div className="mt-4 pt-4 border-t border-gray-700 transition-all-smooth">
                            <div className="flex items-center justify-between mb-4 bg-gray-900 p-3 rounded-lg border border-gray-700">
                                <span className="text-xs font-semibold text-gray-200 uppercase tracking-wider">Training Needed</span>
                                <div className="relative inline-block w-12 align-middle select-none">
                                    <input 
                                        type="checkbox" 
                                        checked={data.needsTraining}
                                        onChange={(e) => updateItem(item.id, 'needsTraining', e.target.checked)}
                                        className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"
                                    />
                                    <label className="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"></label>
                                </div>
                            </div>
                            
                            <label className="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Personal Notes</label>
                            <textarea
                                className="w-full bg-gray-900 text-white rounded-lg p-3 text-sm outline-none focus:ring-1 focus:ring-kenpo-red border border-gray-700 transition-all-smooth resize-none"
                                rows="3"
                                placeholder="Add tips, key steps, or corrections..."
                                value={data.notes}
                                onChange={(e) => updateItem(item.id, 'notes', e.target.value)}
                            ></textarea>
                        </div>
                    )}
                </div>
            );
        };

        // TAB 1: Curriculum
        const CurriculumTab = ({ belts, selectedBelt, setSelectedBelt, kenpoData, userData, updateItem }) => {
            const items = useMemo(() => kenpoData.filter(i => i.belt === selectedBelt), [selectedBelt, kenpoData]);
            
            return (
                <div className="pb-28 px-4 pt-4">
                    <div className="flex overflow-x-auto no-scrollbar gap-2 mb-5 pb-1">
                        {belts.map(belt => (
                            <button
                                key={belt}
                                onClick={() => setSelectedBelt(belt)}
                                className={`whitespace-nowrap px-4 py-2 rounded-full font-semibold transition-colors shadow-sm text-xs ${
                                    selectedBelt === belt 
                                    ? 'bg-kenpo-red text-white' 
                                    : 'bg-gray-800 text-gray-400 hover:bg-gray-700 border border-gray-700'
                                }`}
                            >
                                {belt} Belt
                            </button>
                        ))}
                    </div>

                    {items.length > 0 ? (
                        items.map(item => <ItemCard key={item.id} item={item} userData={userData} updateItem={updateItem} />)
                    ) : (
                        <div className="text-center text-gray-500 mt-10">No items found for this belt.</div>
                    )}
                </div>
            );
        };

        // TAB 2: Browse (Categories: Empty Hands, Stick, Knife, Gun, 2 Person)
        const BrowseTab = ({ kenpoData, userData, updateItem }) => {
            const [filter, setFilter] = useState('Empty Hands');
            const filters = ['Empty Hands', 'Stick', 'Knife', 'Gun', '2 Person'];

            const items = useMemo(() => {
                return kenpoData.filter(item => {
                    // Only include Techniques (no Sets or Forms)
                    if (item.type !== 'Technique') return false;
                    
                    const name = item.name.toLowerCase();
                    const isGun = name.includes('gun');
                    const isKnife = name.includes('knife');
                    const isStick = name.includes('club'); // Only matches "club"
                    const is2Person = name.includes('2 man');
                    
                    if (filter === 'Gun') return isGun;
                    if (filter === 'Knife') return isKnife;
                    if (filter === 'Stick') return isStick;
                    if (filter === '2 Person') return is2Person;
                    if (filter === 'Empty Hands') return !isGun && !isKnife && !isStick && !is2Person;
                    
                    return false;
                });
            }, [filter, kenpoData]);

            return (
                <div className="pb-28 px-4 pt-4">
                    <div className="flex overflow-x-auto no-scrollbar gap-2 mb-5 pb-1">
                        {filters.map(f => (
                            <button
                                key={f}
                                onClick={() => setFilter(f)}
                                className={`whitespace-nowrap px-4 py-2 rounded-full font-semibold transition-colors shadow-sm text-xs ${
                                    filter === f 
                                    ? 'bg-blue-600 text-white' 
                                    : 'bg-gray-800 text-gray-400 hover:bg-gray-700 border border-gray-700'
                                }`}
                            >
                                {f}
                            </button>
                        ))}
                    </div>

                    <div className="mb-4">
                        <span className="text-xs text-gray-500 font-bold uppercase tracking-wider">{items.length} Techniques Found</span>
                    </div>

                    {items.length > 0 ? (
                        items.map(item => <ItemCard key={item.id} item={item} userData={userData} updateItem={updateItem} />)
                    ) : (
                        <div className="text-center text-gray-500 mt-10">No techniques match this filter.</div>
                    )}
                </div>
            );
        };

        // TAB 3: Training Plan
        const TrainingPlanTab = ({ kenpoData, userData, updateItem }) => {
            const items = useMemo(() => kenpoData.filter(i => userData[i.id]?.needsTraining), [userData, kenpoData]);
            
            return (
                <div className="pb-28 px-4 pt-6">
                    <div className="mb-5">
                        <h2 className="text-xl font-bold text-white">Training Plan</h2>
                        <p className="text-gray-400 text-xs mt-0.5">Techniques & forms flagged for extra practice across all belts.</p>
                    </div>
                    
                    {items.length > 0 ? (
                        items.map(item => <ItemCard key={item.id} item={item} userData={userData} updateItem={updateItem} />)
                    ) : (
                        <div className="text-center mt-20 p-8 bg-gray-800 rounded-2xl border border-gray-700 shadow-lg">
                            <span className="text-4xl block mb-3">🥋</span>
                            <h3 className="text-lg font-bold text-white mb-1">Your training plan is clear!</h3>
                            <p className="text-gray-400 text-xs">Flag items in the Curriculum or use Flashcards to add review items here.</p>
                        </div>
                    )}
                </div>
            );
        };

        // TAB 4: Flashcards
        const FlashcardTab = ({ belts, selectedBelt, setSelectedBelt, kenpoData, userData, updateItem }) => {
            const [sessionActive, setSessionActive] = useState(false);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [results, setResults] = useState({ up: 0, down: 0 });

            useEffect(() => {
                setSessionActive(false);
                setCurrentIndex(0);
                setResults({ up: 0, down: 0 });
            }, [selectedBelt]);

            const flashcardItems = useMemo(() => kenpoData.filter(i => i.belt === selectedBelt), [selectedBelt, kenpoData]);

            const startSession = () => {
                setSessionActive(true);
                setCurrentIndex(0);
                setResults({ up: 0, down: 0 });
            };

            const handleVote = (needsWork) => {
                const currentItem = flashcardItems[currentIndex];
                if (needsWork) {
                    // Update state via prop (which triggers localStorage save) without crashing the sequence
                    updateItem(currentItem.id, 'needsTraining', true);
                    setResults(prev => ({ ...prev, down: prev.down + 1 }));
                } else {
                    setResults(prev => ({ ...prev, up: prev.up + 1 }));
                }
                setCurrentIndex(prev => prev + 1);
            };

            if (!sessionActive) {
                return (
                    <div className="pb-28 px-4 pt-6 flex flex-col items-center justify-center min-h-[75vh]">
                        <h2 className="text-xl font-bold text-white mb-4">Flashcard Study</h2>
                        
                        <div className="flex overflow-x-auto no-scrollbar gap-2 mb-6 pb-1 w-full justify-center">
                            {belts.map(belt => (
                                <button
                                    key={belt}
                                    onClick={() => setSelectedBelt(belt)}
                                    className={`whitespace-nowrap px-3 py-1.5 rounded-full font-semibold transition-colors text-xs ${
                                        selectedBelt === belt 
                                        ? 'bg-kenpo-red text-white' 
                                        : 'bg-gray-800 text-gray-400 border border-gray-700'
                                    }`}
                                >
                                    {belt}
                                </button>
                            ))}
                        </div>

                        <div className="bg-gray-800 border border-gray-700 p-6 rounded-2xl w-full max-w-sm text-center shadow-lg mb-6">
                            <p className="text-gray-300 text-sm mb-2">
                                Selected Belt: <span className="text-white font-bold">{selectedBelt}</span>
                            </p>
                            <p className="text-gray-500 text-xs mb-6">{flashcardItems.length} items in this curriculum group</p>
                            <button
                                onClick={startSession}
                                className="w-full bg-kenpo-red hover:bg-kenpo-redHover text-white font-bold py-3.5 rounded-xl shadow-md transition-colors text-sm"
                            >
                                Start Flashcards
                            </button>
                        </div>
                    </div>
                );
            }

            if (currentIndex >= flashcardItems.length) {
                return (
                    <div className="pb-28 px-4 pt-10 flex flex-col items-center justify-center min-h-[75vh] text-center">
                        <h2 className="text-2xl font-bold text-white mb-2">Session Complete!</h2>
                        <p className="text-gray-400 text-xs mb-8">{selectedBelt} Belt Review Summary</p>
                        
                        <div className="flex gap-4 w-full max-w-sm mb-8">
                            <div className="flex-1 bg-gray-800 border border-gray-700 p-5 rounded-2xl flex flex-col items-center">
                                <Icons.ThumbsUp />
                                <span className="text-3xl font-black text-emerald-400 mt-2">{results.up}</span>
                                <span className="text-xs text-gray-400 font-semibold mt-1">Got It</span>
                            </div>
                            <div className="flex-1 bg-gray-800 border border-gray-700 p-5 rounded-2xl flex flex-col items-center">
                                <Icons.ThumbsDown />
                                <span className="text-3xl font-black text-kenpo-red mt-2">{results.down}</span>
                                <span className="text-xs text-gray-400 font-semibold mt-1">Needs Work</span>
                            </div>
                        </div>
                        
                        <p className="text-xs text-gray-400 mb-8 px-4">
                            Items marked with <span className="text-kenpo-red font-bold">Needs Work</span> have been added to your Training Plan.
                        </p>
                        
                        <button
                            onClick={() => setSessionActive(false)}
                            className="w-full max-w-sm bg-gray-700 hover:bg-gray-600 text-white font-bold py-3.5 rounded-xl border border-gray-600 transition-colors text-sm"
                        >
                            Back to Flashcard Menu
                        </button>
                    </div>
                );
            }

            const currentCard = flashcardItems[currentIndex];

            return (
                <div className="pb-28 px-4 pt-6 flex flex-col items-center justify-center min-h-[75vh]">
                    <div className="w-full max-w-sm flex justify-between items-center mb-4 px-1">
                        <span className="text-xs text-gray-400 font-semibold uppercase tracking-wider">{selectedBelt} Belt</span>
                        <span className="text-xs text-gray-400 font-mono bg-gray-800 px-2.5 py-1 rounded-md">
                            {currentIndex + 1} / {flashcardItems.length}
                        </span>
                    </div>

                    <div className="w-full max-w-sm aspect-[4/3] bg-gray-800 rounded-2xl shadow-xl border border-gray-700 flex flex-col items-center justify-center p-6 text-center relative overflow-hidden mb-6">
                        <div className="absolute top-0 right-0 w-24 h-24 bg-kenpo-red rounded-full opacity-10 blur-2xl"></div>
                        
                        <span className={`text-[10px] font-bold uppercase tracking-widest mb-3 ${
                            currentCard.type === 'Form' ? 'text-kenpo-gold' : 
                            currentCard.type === 'Set' ? 'text-blue-400' : 'text-kenpo-red'
                        }`}>
                            {currentCard.type}
                        </span>
                        
                        <h2 className="text-2xl font-black text-white leading-snug">
                            {currentCard.name}
                        </h2>
                    </div>

                    <div className="flex gap-3 w-full max-w-sm">
                        <button
                            onClick={() => handleVote(true)}
                            className="flex-1 bg-gray-800 hover:bg-gray-700 text-white py-4 rounded-xl font-bold transition-colors border border-gray-700 hover:border-kenpo-red flex flex-col items-center justify-center gap-1"
                        >
                            <span className="text-kenpo-red text-lg">👎</span>
                            <span className="text-xs text-gray-300">Needs Work</span>
                        </button>
                        <button
                            onClick={() => handleVote(false)}
                            className="flex-1 bg-kenpo-red hover:bg-kenpo-redHover text-white py-4 rounded-xl font-bold transition-colors flex flex-col items-center justify-center gap-1 shadow-md shadow-red-900/20"
                        >
                            <span className="text-white text-lg">👍</span>
                            <span className="text-xs text-white">Got It</span>
                        </button>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        const App = () => {
            const [activeTab, setActiveTab] = useState('Curriculum');
            const [selectedBelt, setSelectedBelt] = useState('Yellow');
            
            // Lazy load state from localStorage to avoid flashing
            const [userData, setUserData] = useState(() => {
                const saved = localStorage.getItem('@kenpo_data');
                return saved ? JSON.parse(saved) : {};
            });

            // Universal update function passed to all components
            const updateItem = (id, field, value) => {
                setUserData(prev => {
                    const updated = {
                        ...prev,
                        [id]: {
                            ...(prev[id] || { notes: '', needsTraining: false }),
                            [field]: value
                        }
                    };
                    localStorage.setItem('@kenpo_data', JSON.stringify(updated));
                    return updated;
                });
            };

            return (
                <div className="max-w-md mx-auto bg-[#111827] min-h-screen relative shadow-2xl flex flex-col">
                    <div className="bg-gray-900/95 sticky top-0 z-20 py-4 px-4 border-b border-gray-800 backdrop-blur-md flex items-center justify-center">
                        <h1 className="text-base font-black tracking-widest uppercase text-white">
                            AMERICAN <span className="text-kenpo-red">KENPO</span>
                        </h1>
                    </div>

                    <main className="flex-1">
                        {activeTab === 'Curriculum' && (
                            <CurriculumTab 
                                belts={belts} 
                                selectedBelt={selectedBelt} 
                                setSelectedBelt={setSelectedBelt} 
                                kenpoData={kenpoData} 
                                userData={userData} 
                                updateItem={updateItem} 
                            />
                        )}
                        {activeTab === 'Browse' && (
                            <BrowseTab 
                                kenpoData={kenpoData} 
                                userData={userData} 
                                updateItem={updateItem} 
                            />
                        )}
                        {activeTab === 'TrainingPlan' && (
                            <TrainingPlanTab 
                                kenpoData={kenpoData} 
                                userData={userData} 
                                updateItem={updateItem} 
                            />
                        )}
                        {activeTab === 'Flashcards' && (
                            <FlashcardTab 
                                belts={belts} 
                                selectedBelt={selectedBelt} 
                                setSelectedBelt={setSelectedBelt} 
                                kenpoData={kenpoData} 
                                userData={userData} 
                                updateItem={updateItem} 
                            />
                        )}
                    </main>

                    <nav className="fixed bottom-0 max-w-md w-full bg-gray-900/95 backdrop-blur-lg border-t border-gray-800 flex justify-around items-center py-3 px-2 z-50">
                        <button 
                            onClick={() => setActiveTab('Curriculum')}
                            className={`flex flex-col items-center py-1.5 px-4 rounded-xl transition-colors ${activeTab === 'Curriculum' ? 'text-kenpo-red' : 'text-gray-500 hover:text-gray-300'}`}
                        >
                            <Icons.Book />
                            <span className="text-[10px] font-bold mt-1">Curriculum</span>
                        </button>
                        
                        <button 
                            onClick={() => setActiveTab('Browse')}
                            className={`flex flex-col items-center py-1.5 px-4 rounded-xl transition-colors ${activeTab === 'Browse' ? 'text-kenpo-red' : 'text-gray-500 hover:text-gray-300'}`}
                        >
                            <Icons.Search />
                            <span className="text-[10px] font-bold mt-1">Browse</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('TrainingPlan')}
                            className={`flex flex-col items-center py-1.5 px-4 rounded-xl transition-colors ${activeTab === 'TrainingPlan' ? 'text-kenpo-red' : 'text-gray-500 hover:text-gray-300'}`}
                        >
                            <Icons.List />
                            <span className="text-[10px] font-bold mt-1">Training</span>
                        </button>

                        <button 
                            onClick={() => setActiveTab('Flashcards')}
                            className={`flex flex-col items-center py-1.5 px-4 rounded-xl transition-colors ${activeTab === 'Flashcards' ? 'text-kenpo-red' : 'text-gray-500 hover:text-gray-300'}`}
                        >
                            <Icons.Flashcard />
                            <span className="text-[10px] font-bold mt-1">Flashcards</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
